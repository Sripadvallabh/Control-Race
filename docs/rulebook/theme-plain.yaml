linkColor: "#000000"

pageSetup:
  size: A6
  margin-top: 1.05cm
  margin-bottom: 0.85cm
  margin-left: 1.25cm
  margin-right: 1.25cm
  spacing-footer: 3mm
  spacing-header: 3mm

styles:
  base:
    fontName: fontSans
    fontSize: 8.7
    leading: 11.2
    textColor: "#333333"

  bodytext:
    alignment: TA_LEFT
    hyphenation: false
    parent: normal
    spaceAfter: 4
    spaceBefore: 4

  title:
    alignment: TA_LEFT
    fontName: fontSans
    fontSize: 14
    keepWithNext: false
    leading: 17
    parent: heading
    spaceAfter: 13
    spaceBefore: 3
    textColor: "#222222"

  heading:
    fontName: fontSansBold
    keepWithNext: true
    parent: normal
    spaceAfter: 6
    spaceBefore: 13
    textColor: "#222222"

  heading1:
    fontSize: 10
    leading: 12
    parent: heading
    spaceBefore: 16

  heading2:
    fontSize: 9.2
    leading: 11.4
    parent: heading

  heading3:
    fontSize: 8.7
    leading: 11.2
    parent: heading

  field-list:
    colWidths:
    - 1.7cm
    - null
    commands:
    - - VALIGN
      - - 0
        - 0
      - - -1
        - -1
      - TOP
    - - TOPPADDING
      - - 0
        - 0
      - - -1
        - -1
      - 1
    parent: bodytext
    spaceAfter: 12
    spaceBefore: 4

  fieldname:
    alignment: TA_LEFT
    fontName: fontSansBold
    parent: bodytext
    textColor: "#222222"

  fieldvalue:
    parent: bodytext

  topic-title:
    fontName: fontSans
    fontSize: 9.6
    leading: 12
    parent: heading
    spaceAfter: 10
    textColor: "#777777"

  contents:
    parent: normal
    spaceAfter: 10
    spaceBefore: 4

  toc:
    fontSize: 8.7
    leading: 13
    parent: normal
    textColor: "#333333"

  toc1:
    fontName: fontSansBold
    parent: toc
    spaceBefore: 4

  toc2:
    leftIndent: 14
    parent: toc

  bullet-list:
    colWidths:
    - 10
    - null
    commands:
    - - VALIGN
      - - 0
        - 0
      - - -1
        - -1
      - TOP
    - - RIGHTPADDING
      - - 0
        - 0
      - - 1
        - -1
      - 0
    parent: bodytext
    spaceBefore: 5

  bullet-list-item:
    parent: bodytext

  table:
    alignment: TA_CENTER
    commands:
    - - VALIGN
      - - 0
        - 0
      - - -1
        - -1
      - TOP
    - - INNERGRID
      - - 0
        - 0
      - - -1
        - -1
      - 0.25
      - "#999999"
    - - LINEBELOW
      - - 0
        - 0
      - - -1
        - 0
      - 0.75
      - "#333333"
    - - BOX
      - - 0
        - 0
      - - -1
        - -1
      - 0.5
      - "#333333"
    parent: normal
    spaceAfter: 9
    spaceBefore: 9

  table-body:
    parent: normal

  table-heading:
    alignment: TA_CENTER
    fontName: fontSansBold
    parent: normal
    textColor: "#222222"

  header:
    alignment: TA_CENTER
    fontName: fontSans
    fontSize: 7.7
    leading: 9
    parent: normal
    textColor: "#777777"

  footer:
    alignment: TA_CENTER
    fontName: fontSansBold
    fontSize: 8.5
    leading: 10
    parent: normal
    textColor: "#222222"
